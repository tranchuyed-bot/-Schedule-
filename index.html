<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <!-- Tối ưu cho thiết bị di động, bỏ user-scalable=no để không vi phạm accessibility nhưng vẫn chặn zoom bằng font 16px -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Lịch Học Kỳ 1 – 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* ===== VARIABLES ===== */
        :root {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);

            --tag-uni: #dbeafe; --tag-uni-text: #1e40af;
            --tag-goal: #fef3c7; --tag-goal-text: #92400e;
            --tag-health: #d1fae5; --tag-health-text: #065f46;
            --tag-money: #fce7f3; --tag-money-text: #9d174d;
            --tag-other: #e0e7ff; --tag-other-text: #3730a3;

            --dot-uni: #3b82f6; --dot-goal: #f59e0b;
            --dot-health: #10b981; --dot-money: #ec4899; --dot-other: #6366f1;
        }

        [data-theme="dark"] {
            --bg-body: #0f172a; --bg-card: #1e293b;
            --text-main: #f1f5f9; --text-muted: #94a3b8;
            --border: #334155; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --tag-uni: #1e3a5f; --tag-uni-text: #93c5fd;
            --tag-goal: #451a03; --tag-goal-text: #fcd34d;
            --tag-health: #064e3b; --tag-health-text: #6ee7b7;
            --tag-money: #4c0519; --tag-money-text: #f9a8d4;
            --tag-other: #1e1b4b; --tag-other-text: #a5b4fc;
        }

        /* ===== RESET & SAFARI FIXES ===== */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent; /* Tắt nháy xanh khi bấm trên iOS */
        }
        
        body {
            background: var(--bg-body); color: var(--text-main);
            display: flex; flex-direction: column;
            height: 100vh; height: 100dvh; /* Dùng dvh cho iOS 15+ để tránh thanh địa chỉ che mất */
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
            /* Safe area cho iPhone tai thỏ */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* ===== HEADER ===== */
        header {
            background: var(--bg-card); padding: 14px 20px;
            border-bottom: 1px solid var(--border); display: flex;
            justify-content: space-between; align-items: center; flex-shrink: 0; gap: 8px;
        }
        .header-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .header-title i { color: var(--primary); }
        .header-actions { display: flex; align-items: center; gap: 4px; }
        .header-actions button {
            background: transparent; border: none; cursor: pointer; color: var(--text-muted);
            padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: 500;
            display: flex; align-items: center; gap: 6px;
            -webkit-appearance: none; /* Sửa lỗi hiển thị nút bấm mặc định trên iOS */
        }
        .header-actions button:active { opacity: 0.7; }
        .header-actions .btn-primary { background: var(--primary); color: #fff; border-radius: 20px; padding: 8px 16px; }
        .header-actions .btn-danger { color: #ef4444; }

        /* ===== MAIN LAYOUT ===== */
        .main-layout { display: flex; flex: 1; overflow: hidden; }

        /* ===== CALENDAR SECTION ===== */
        .calendar-section {
            flex: 1.5; padding: 20px; display: flex; flex-direction: column;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        .calendar-card {
            background: var(--bg-card); border-radius: 16px; padding: 20px;
            box-shadow: var(--shadow); max-width: 820px; width: 100%; margin: 0 auto;
        }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .month-title { font-size: 20px; font-weight: 700; text-transform: capitalize; }
        .month-nav { display: flex; gap: 8px; }
        .month-nav button {
            background: var(--bg-body); border: none; border-radius: 10px; width: 44px; height: 44px; /* Tăng touch target */
            cursor: pointer; color: var(--text-main); display: flex; align-items: center; justify-content: center;
        }

        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 600; color: var(--text-muted); font-size: 13px; margin-bottom: 12px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }

        .day-box {
            aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; padding: 8px 4px;
            cursor: pointer; font-weight: 500; font-size: 15px; border: 2px solid transparent; background: transparent;
        }
        .day-box.empty { pointer-events: none; }
        .day-box.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35); border-color: var(--primary); }
        .day-box.today { border-color: var(--primary); }
        .day-box .day-number { font-size: 16px; font-weight: 600; }
        .day-box.active .day-number { color: #fff; }

        .event-dots { display: flex; gap: 3px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
        .dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot-uni { background: var(--dot-uni); } .dot-goal { background: var(--dot-goal); }
        .dot-health { background: var(--dot-health); } .dot-money { background: var(--dot-money); } .dot-other { background: var(--dot-other); }
        .day-box.active .dot { border: 1px solid rgba(255,255,255,0.5); }

        /* ===== AGENDA SECTION ===== */
        .agenda-section {
            flex: 1; background: var(--bg-card); border-left: 1px solid var(--border);
            display: flex; flex-direction: column; min-width: 320px; max-width: 420px;
        }
        .agenda-header {
            padding: 20px; border-bottom: 1px solid var(--border); display: flex;
            justify-content: space-between; align-items: center;
        }
        .agenda-date { font-size: 18px; font-weight: 700; }
        .agenda-date small { font-weight: 400; font-size: 14px; color: var(--text-muted); display: block; margin-top: 2px; }
        
        .agenda-list {
            flex: 1; overflow-y: auto; padding: 16px 20px 24px; display: flex;
            flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch;
        }
        .agenda-card {
            padding: 16px; border-radius: 12px; border: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 8px; position: relative; background: var(--bg-body);
        }
        .agenda-card.uni { background: var(--tag-uni); border-color: transparent; }
        .agenda-card.goal { background: var(--tag-goal); border-color: transparent; }
        .agenda-card.health { background: var(--tag-health); border-color: transparent; }
        .agenda-card.money { background: var(--tag-money); border-color: transparent; }
        .agenda-card.other { background: var(--tag-other); border-color: transparent; }

        .ag-time { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; opacity: 0.8; }
        .ag-title { font-size: 16px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; line-height: 1.4; }
        
        .ag-details { font-size: 13px; color: var(--text-main); opacity: 0.85; margin-top: 4px; display: flex; flex-direction: column; gap: 6px; }
        .ag-details span { display: flex; align-items: center; gap: 8px; }
        .ag-details i { width: 14px; text-align: center; opacity: 0.7; }

        .ag-delete {
            position: absolute; top: 12px; right: 12px; cursor: pointer; color: #9ca3af;
            font-size: 16px; padding: 8px; /* Tăng padding để dễ bấm trên iPhone */
        }
        .ag-delete:active { color: #ef4444; }

        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 0; }
        .empty-state i { font-size: 44px; color: #d1d5db; margin-bottom: 12px; }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: none;
            align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px);
            padding: 20px;
        }
        .modal {
            background: var(--bg-card); width: 100%; max-width: 440px; border-radius: 20px;
            padding: 24px; animation: modalIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); max-height: 90dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        @keyframes modalIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        
        /* QUAN TRỌNG CHO iPHONE: font-size phải >= 16px để không tự động zoom */
        .form-group input, .form-group select {
            width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px;
            outline: none; background: var(--bg-body); color: var(--text-main);
            font-size: 16px !important; /* FIX LỖI ZOOM iPHONE */
            -webkit-appearance: none; /* Bỏ style select cục mịch mặc định */
        }
        
        /* Custom mũi tên cho select trên iPhone */
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: "\f078"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); pointer-events: none; font-size: 12px;
        }

        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
        .modal-actions button {
            padding: 12px 20px; border: none; border-radius: 12px; font-weight: 600; font-size: 15px;
            -webkit-appearance: none; cursor: pointer; flex: 1;
        }
        .btn-cancel { background: var(--bg-body); color: var(--text-main); }
        .btn-save { background: var(--primary); color: #fff; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed; bottom: calc(30px + env(safe-area-inset-bottom)); /* Tránh Home indicator */
            left: 50%; transform: translateX(-50%) translateY(80px);
            background: #1f2937; color: #fff; padding: 14px 28px; border-radius: 30px; font-size: 14px; font-weight: 500;
            z-index: 2000; opacity: 0; transition: all 0.35s ease; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: #dc2626; }
        .hidden-input { display: none; }

        /* ===== MOBILE RESPONSIVE (iPHONE) ===== */
        @media (max-width: 820px) {
            .main-layout { flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
            .calendar-section { flex: none; padding: 16px 12px 0 12px; }
            .calendar-card { padding: 16px; border-radius: 16px; }
            .day-box { padding: 4px 2px; }
            .day-box .day-number { font-size: 15px; }
            
            .agenda-section { border-left: none; max-width: 100%; border-top: 1px solid var(--border); flex: 1; margin-top: 16px; background: transparent; }
            .agenda-header { padding: 16px 16px 8px; border-bottom: none; }
            .agenda-list { padding: 8px 16px 40px; }
            
            .header-actions span { display: none; /* Ẩn chữ nút menu, chỉ giữ icon để đỡ chật màn hình */ }
            .header-actions .btn-primary span { display: inline; } /* Giữ chữ Thêm */
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title"><i class="fa-regular fa-calendar-check"></i><span>Lịch Trình</span></div>
        <div class="header-actions">
            <button onclick="exportData()"><i class="fa-solid fa-download"></i> <span>Xuất</span></button>
            <button onclick="document.getElementById('importInput').click()"><i class="fa-solid fa-upload"></i> <span>Nhập</span></button>
            <input type="file" id="importInput" class="hidden-input" accept=".json" onchange="importData(event)" />
            <button onclick="clearAll()" class="btn-danger"><i class="fa-regular fa-trash-can"></i> <span>Xóa</span></button>
            <button onclick="toggleTheme()"><i class="fa-regular fa-moon" id="themeIcon"></i></button>
        </div>
    </header>

    <div class="main-layout">
        <div class="calendar-section">
            <div class="calendar-card">
                <div class="calendar-header">
                    <div class="month-title" id="monthTitle">Tháng 9, 2026</div>
                    <div class="month-nav">
                        <button onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                        <button onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="weekdays">
                    <div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div><div>CN</div>
                </div>
                <div class="days-grid" id="daysGrid"></div>
            </div>
        </div>

        <div class="agenda-section">
            <div class="agenda-header">
                <div class="agenda-date" id="selectedDateDisplay"></div>
                <button class="btn-primary" style="padding: 8px 16px; border-radius: 12px; background: var(--primary); color: white; border:none; font-weight: 600;" onclick="openModal()">
                    <i class="fa-solid fa-plus"></i> Thêm
                </button>
            </div>
            <div class="agenda-list" id="agendaList"></div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal">
            <h2><i class="fa-regular fa-calendar-plus"></i> Thêm lịch trình</h2>
            <div class="form-group">
                <label>Tên môn học / Sự kiện</label>
                <input type="text" id="evTitle" placeholder="VD: Giải tích 1" autocomplete="off" />
            </div>
            <div class="form-group">
                <label>Thời gian</label>
                <input type="text" id="evTime" placeholder="VD: 13:00 - 16:35" autocomplete="off" />
            </div>
            <div class="form-group">
                <label>Phân loại</label>
                <div class="select-wrapper">
                    <select id="evType">
                        <option value="uni">📚 Môn Đại Học</option>
                        <option value="goal">🎯 Kỹ năng & Mục tiêu</option>
                        <option value="health">🏃 Sức khỏe</option>
                        <option value="money">💰 Tài chính</option>
                        <option value="other">🎨 Khác</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Lớp / Nhóm (Tùy chọn)</label>
                <input type="text" id="evGroup" placeholder="VD: 04" autocomplete="off" />
            </div>
            <div class="form-group">
                <label>Phòng học (Tùy chọn)</label>
                <input type="text" id="evRoom" placeholder="VD: 2A27" autocomplete="off" />
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Đóng</button>
                <button class="btn-save" onclick="saveEvent()">Lưu lại</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let db = {};
        
        // Mẫu hiển thị gốc
        const SAMPLE_DATA = {
            "2026-09-07": [{ title: "Giải tích 1 (BAS1203)", time: "13:00 - 16:35", type: "uni", nhóm: "04", phòng: "2E27-2E27" }],
            "2026-09-08": [{ title: "Giáo dục thể chất 1 (BAS1106)", time: "13:00 - 16:35", type: "uni", nhóm: "04", phòng: "SANTRG1-san truong 1" }],
            "2026-09-12": [{ title: "Triết học Mác - Lênin (BAS1150)", time: "07:00 - 10:35", type: "uni", nhóm: "12", phòng: "2A27-2A27" }]
        };

        let currentDate = new Date(2026, 8, 4); // Tháng 9/2026
        let selectedDateStr = "2026-09-04";

        const TYPE_ICONS = { uni: 'fa-book-open', goal: 'fa-bullseye', health: 'fa-heart-pulse', money: 'fa-coins', other: 'fa-puzzle-piece' };
        const TYPE_CLASSES = { uni: 'uni', goal: 'goal', health: 'health', money: 'money', other: 'other' };

        function loadData() {
            try {
                const raw = localStorage.getItem('calendar_month_data');
                if (raw) { const parsed = JSON.parse(raw); if (typeof parsed === 'object' && Object.keys(parsed).length) { db = parsed; return true; } }
            } catch (_) {} return false;
        }
        function saveData() { localStorage.setItem('calendar_month_data', JSON.stringify(db)); }
        
        function loadTheme() {
            const dark = localStorage.getItem('calendar_theme_month') === 'dark';
            if (dark) { document.documentElement.setAttribute('data-theme', 'dark'); document.getElementById('themeIcon').className = 'fa-regular fa-sun'; }
        }
        function saveTheme(dark) { localStorage.setItem('calendar_theme_month', dark ? 'dark' : 'light'); }

        function renderCalendar() {
            const grid = document.getElementById('daysGrid'); grid.innerHTML = '';
            const year = currentDate.getFullYear(); const month = currentDate.getMonth();
            const monthNames = ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];
            document.getElementById('monthTitle').textContent = `${monthNames[month]}, ${year}`;

            let firstDayIndex = new Date(year, month, 1).getDay() - 1; if (firstDayIndex === -1) firstDayIndex = 6;
            const lastDay = new Date(year, month + 1, 0).getDate();
            const todayStr = new Date().toLocaleDateString('en-CA'); // Trả về định dạng yyyy-mm-dd theo giờ local

            for (let i = 0; i < firstDayIndex; i++) grid.innerHTML += `<div class="day-box empty"></div>`;
            for (let i = 1; i <= lastDay; i++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const events = db[dateStr] || [];
                let dotsHtml = '';
                if (events.length > 0) {
                    const types = new Set(events.map(e => e.type));
                    dotsHtml = `<div class="event-dots">`;
                    ['uni', 'goal', 'health', 'money', 'other'].forEach(t => { if(types.has(t)) dotsHtml += `<div class="dot dot-${t}"></div>`; });
                    dotsHtml += `</div>`;
                }
                const activeClass = dateStr === selectedDateStr ? 'active' : '';
                const todayClass = dateStr === todayStr ? 'today' : '';
                grid.innerHTML += `<div class="day-box ${activeClass} ${todayClass}" onclick="selectDate('${dateStr}')"><span class="day-number">${i}</span>${dotsHtml}</div>`;
            }
        }

        function renderAgenda() {
            const events = db[selectedDateStr] || [];
            const [y, m, d] = selectedDateStr.split('-');
            const dayName = ['Chủ Nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'][new Date(y, m - 1, d).getDay()];
            document.getElementById('selectedDateDisplay').innerHTML = `${d}/${m}/${y} <small>${dayName}</small>`;

            const list = document.getElementById('agendaList');
            if (events.length === 0) {
                list.innerHTML = `<div class="empty-state"><i class="fa-regular fa-folder-open"></i><p>Bạn không có lịch học nào.<br/>Dành thời gian nghỉ ngơi nhé!</p></div>`; return;
            }

            let html = '';
            events.forEach((ev, index) => {
                const icon = TYPE_ICONS[ev.type] || 'fa-puzzle-piece';
                const cls = TYPE_CLASSES[ev.type] || 'other';
                
                let detailsHtml = '';
                const groupData = ev.nhóm || ev.group || ev.lớp;
                const roomData = ev.phòng || ev.room; 
                
                if (groupData || roomData) {
                    detailsHtml = `<div class="ag-details">`;
                    if (groupData) detailsHtml += `<span><i class="fa-solid fa-users"></i> Lớp/Nhóm: <strong>${groupData}</strong></span>`;
                    if (roomData) detailsHtml += `<span><i class="fa-solid fa-location-dot"></i> Phòng: <strong>${roomData}</strong></span>`;
                    detailsHtml += `</div>`;
                }

                html += `
                    <div class="agenda-card ${cls}">
                        <i class="fa-regular fa-circle-xmark ag-delete" onclick="deleteEvent('${selectedDateStr}', ${index})"></i>
                        <div class="ag-time"><i class="fa-regular fa-clock"></i> ${ev.time || 'Cả ngày'}</div>
                        <div class="ag-title"><span class="type-icon"><i class="fa-solid ${icon}"></i></span>${ev.title}</div>
                        ${detailsHtml}
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        function selectDate(dateStr) { selectedDateStr = dateStr; renderCalendar(); renderAgenda(); }
        function changeMonth(step) {
            currentDate.setMonth(currentDate.getMonth() + step);
            selectedDateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-01`;
            renderCalendar(); renderAgenda();
        }

        function deleteEvent(dateStr, index) {
            if (confirm('Bạn có chắc muốn xóa lịch này?')) {
                db[dateStr].splice(index, 1); if (db[dateStr].length === 0) delete db[dateStr];
                saveData(); renderCalendar(); renderAgenda(); showToast('Đã xóa lịch');
            }
        }

        function openModal() {
            document.getElementById('evTitle').value = ''; document.getElementById('evTime').value = '';
            document.getElementById('evType').value = 'uni'; document.getElementById('evGroup').value = ''; document.getElementById('evRoom').value = '';
            document.getElementById('eventModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('eventModal').style.display = 'none'; }

        function saveEvent() {
            const title = document.getElementById('evTitle').value.trim();
            const time = document.getElementById('evTime').value.trim() || 'Cả ngày';
            const type = document.getElementById('evType').value;
            const group = document.getElementById('evGroup').value.trim();
            const room = document.getElementById('evRoom').value.trim();

            if (!title) return showToast('Vui lòng nhập tên công việc!', true);
            if (!db[selectedDateStr]) db[selectedDateStr] = [];
            
            const newEvent = { title, time, type };
            if (group) newEvent.nhóm = group;
            if (room) newEvent.phòng = room;

            db[selectedDateStr].push(newEvent);
            saveData(); closeModal(); renderCalendar(); renderAgenda(); showToast('Đã lưu thành công!');
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeIcon').className = isDark ? 'fa-regular fa-moon' : 'fa-regular fa-sun';
            saveTheme(!isDark);
        }

        function exportData() {
            const blob = new Blob([JSON.stringify({ version: '1.0', exportedAt: new Date().toISOString(), events: db }, null, 2)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `lich_hoc_${new Date().toISOString().slice(0,10)}.json`;
            a.click(); URL.revokeObjectURL(a.href); showToast('Đã xuất dữ liệu (File .json)');
        }

        function importData(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.events && typeof data.events === 'object') {
                        if (confirm(`Bạn có muốn tải dữ liệu này lên không? Dữ liệu hiện tại sẽ bị xóa sạch.`)) {
                            db = data.events; saveData(); renderCalendar(); renderAgenda(); showToast(`Đã đồng bộ dữ liệu thành công!`);
                        }
                    } else showToast('File định dạng không hợp lệ!', true);
                } catch (_) { showToast('Lỗi đọc file!', true); }
            };
            reader.readAsText(file); event.target.value = '';
        }

        function clearAll() { if (confirm('Bạn có chắc muốn xóa TẤT CẢ lịch trình? Hành động này không thể hoàn tác.')) { db = {}; saveData(); renderCalendar(); renderAgenda(); showToast('Đã xóa trắng lịch trình'); } }

        let toastTimer;
        function showToast(msg, isError = false) {
            const el = document.getElementById('toast'); el.textContent = msg;
            el.className = 'toast' + (isError ? ' error' : '') + ' show';
            clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
        }
        
        // Đóng Modal khi bấm vùng ngoài
        document.getElementById('eventModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });

        function init() {
            loadTheme();
            if (!loadData()) { db = JSON.parse(JSON.stringify(SAMPLE_DATA)); saveData(); }
            
            const keys = Object.keys(db).sort();
            if (keys.length > 0) { selectedDateStr = keys[0]; }
            currentDate = new Date(parseInt(selectedDateStr.split('-')[0]), parseInt(selectedDateStr.split('-')[1]) - 1, 1);
            
            renderCalendar(); renderAgenda();
        }
        init();
    </script>
</body>
</html>
